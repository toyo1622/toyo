name: Build Hi Rider V10 Update Checker

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack V10 source
        run: |
          test -f HiRider-v10-update-source.zip
          unzip -o HiRider-v10-update-source.zip

      - name: Verify exact V10 source
        run: |
          test -f EastWeather/app/src/main/java/com/eastweather/app/MainActivity.kt
          test -f EastWeather/app/src/main/java/com/eastweather/app/HiRiderUpdateChecker.kt
          test -f EastWeather/app/src/main/java/com/eastweather/app/WeatherAlertWorker.kt
          test -f EastWeather/app/src/main/java/com/eastweather/app/RadarActivity.kt
          grep -F 'versionCode 10' EastWeather/app/build.gradle
          grep -F "versionName '0.10'" EastWeather/app/build.gradle
          grep -F 'HiRiderUpdateChecker.check(this, isZh)' EastWeather/app/src/main/java/com/eastweather/app/MainActivity.kt
          grep -F 'Check for updates' EastWeather/app/src/main/java/com/eastweather/app/MainActivity.kt
          grep -F 'raw.githubusercontent.com/toyo1622/toyo/main/hirider-update.json' EastWeather/app/src/main/java/com/eastweather/app/HiRiderUpdateChecker.kt
          grep -F 'showRadarAreaPicker()' EastWeather/app/src/main/java/com/eastweather/app/MainActivity.kt
          grep -F 'overlay=radar' EastWeather/app/src/main/java/com/eastweather/app/RadarActivity.kt
          grep -F 'if (auth.currentUser != null)' EastWeather/app/src/main/java/com/eastweather/app/MainActivity.kt
          grep -F 'Continue with Google' EastWeather/app/src/main/java/com/eastweather/app/MainActivity.kt
          echo 'Hi Rider V10 update source verified.'

      - name: Add Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON"
          printf '%s' "$GOOGLE_SERVICES_JSON" > EastWeather/app/google-services.json

      - name: Restore existing permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.HIRIDER_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Existing release signing key is missing'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hirider-release.jks"
          chmod 600 "$RUNNER_TEMP/hirider-release.jks"

      - name: Build signed V10 APK
        working-directory: EastWeather
        env:
          HIRIDER_KEYSTORE_FILE: ${{ runner.temp }}/hirider-release.jks
          HIRIDER_KEYSTORE_PASSWORD: ${{ secrets.HIRIDER_KEYSTORE_PASSWORD }}
          HIRIDER_KEY_ALIAS: ${{ secrets.HIRIDER_KEY_ALIAS }}
          HIRIDER_KEY_PASSWORD: ${{ secrets.HIRIDER_KEY_PASSWORD }}
        run: gradle assembleRelease -Pkotlin.jvm.target.validation.mode=warning

      - uses: actions/upload-artifact@v4
        with:
          name: HiRider-v0.10-signed-APK
          path: EastWeather/app/build/outputs/apk/release/app-release.apk
