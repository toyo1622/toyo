name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack source
        run: unzip -o HiRider-v6-work-in-progress-source.zip -d source

      - name: Find project folder
        run: |
          find source -maxdepth 4 -type f | head -n 120

          GRADLEW_PATH=$(find source -type f -name gradlew | head -n 1)

          if [ -n "$GRADLEW_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            echo "USE_WRAPPER=true" >> $GITHUB_ENV
          else
            SETTINGS_PATH=$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
            if [ -z "$SETTINGS_PATH" ]; then
              echo "Cannot find gradlew or settings.gradle"
              exit 1
            fi
            PROJECT_DIR=$(dirname "$SETTINGS_PATH")
            echo "USE_WRAPPER=false" >> $GITHUB_ENV
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project folder: $PROJECT_DIR"

      - name: Add Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p "$PROJECT_DIR/app"
          printf '%s' "$GOOGLE_SERVICES_JSON" > "$PROJECT_DIR/app/google-services.json"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          if [ "$USE_WRAPPER" = "true" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: source/**/app/build/outputs/apk/debug/*.apk
