name: Build EastWeather APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip EastWeather project
        run: unzip -o HiRider-v6-work-in-progress-source.zip

      - name: Enable AndroidX
        run: |
          printf 'android.useAndroidX=true\nandroid.enableJetifier=true\n' > EastWeather/gradle.properties

      - name: Add Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > EastWeather/app/google-services.json

      - name: Fix first version startup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("EastWeather/app/src/main/java/com/eastweather/app/MainActivity.kt")
          s = p.read_text()

          old = 'private fun card(s:String):TextView { val v=text(s,18,Color.BLACK); v.setPadding(28,28,28,28); v.setBackgroundColor(Color.rgb(245,247,250)); root.addView(v, LinearLayout.LayoutParams(-1,-2).apply{topMargin=18}); return v }'

          new = 'private fun card(s:String):TextView { val v=TextView(this); v.text=s; v.textSize=18f; v.setTextColor(Color.BLACK); v.setPadding(28,28,28,28); v.setBackgroundColor(Color.rgb(245,247,250)); root.addView(v, LinearLayout.LayoutParams(-1,-2).apply{topMargin=18}); return v }'

          if old in s:
              p.write_text(s.replace(old, new))
          PY

      - name: Build APK
        working-directory: EastWeather
        run: gradle assembleDebug -Pkotlin.jvm.target.validation.mode=warning --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EastWeather-v0.5-APK
          path: EastWeather/app/build/outputs/apk/debug/app-debug.apk
