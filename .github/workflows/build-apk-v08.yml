name: Build HiRider v0.8

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack v0.8 source
        run: |
          test -f HiRider-v8-source.zip
          rm -rf EastWeather
          unzip -o HiRider-v8-source.zip

      - name: Verify HiRider v0.8 source
        run: |
          test -f EastWeather/app/src/main/java/com/eastweather/app/MainActivity.kt
          test -f EastWeather/app/src/main/java/com/eastweather/app/WeatherAlertWorker.kt
          test -f EastWeather/app/google-services.json
          grep -F "versionCode 8" EastWeather/app/build.gradle
          grep -F "versionName '0.8'" EastWeather/app/build.gradle
          grep -F 'if (auth.currentUser != null)' EastWeather/app/src/main/java/com/eastweather/app/MainActivity.kt
          grep -F 'showLogin()' EastWeather/app/src/main/java/com/eastweather/app/MainActivity.kt
          grep -F 'Cyberjaya' EastWeather/app/src/main/java/com/eastweather/app/MainActivity.kt
          grep -F 'Putrajaya' EastWeather/app/src/main/java/com/eastweather/app/MainActivity.kt
          grep -F 'Serdang' EastWeather/app/src/main/java/com/eastweather/app/MainActivity.kt
          grep -F 'Yong Peng' EastWeather/app/src/main/java/com/eastweather/app/MainActivity.kt
          grep -F 'android.permission.POST_NOTIFICATIONS' EastWeather/app/src/main/AndroidManifest.xml
          grep -F 'android:allowBackup="false"' EastWeather/app/src/main/AndroidManifest.xml
          echo 'HiRider v0.8 source and Firebase configuration confirmed.'

      - name: Restore permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.HIRIDER_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Permanent signing key is not configured'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hirider-release.jks"
          chmod 600 "$RUNNER_TEMP/hirider-release.jks"

      - name: Build permanently signed APK
        working-directory: EastWeather
        env:
          HIRIDER_KEYSTORE_FILE: ${{ runner.temp }}/hirider-release.jks
          HIRIDER_KEYSTORE_PASSWORD: ${{ secrets.HIRIDER_KEYSTORE_PASSWORD }}
          HIRIDER_KEY_ALIAS: ${{ secrets.HIRIDER_KEY_ALIAS }}
          HIRIDER_KEY_PASSWORD: ${{ secrets.HIRIDER_KEY_PASSWORD }}
        run: gradle assembleRelease -Pkotlin.jvm.target.validation.mode=warning

      - uses: actions/upload-artifact@v4
        with:
          name: HiRider-v0.8-signed-APK
          path: EastWeather/app/build/outputs/apk/release/app-release.apk
