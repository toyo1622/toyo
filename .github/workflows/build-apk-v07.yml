name: Build HiRider v0.7

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack v0.7 source
        run: |
          test -f HiRider-v7-source.zip
          rm -rf EastWeather
          unzip -o HiRider-v7-source.zip

      - name: Verify OTP-gated source
        run: |
          test -f EastWeather/app/src/main/java/com/eastweather/app/MainActivity.kt
          grep -F 'if (auth.currentUser != null)' EastWeather/app/src/main/java/com/eastweather/app/MainActivity.kt
          grep -F 'showLogin()' EastWeather/app/src/main/java/com/eastweather/app/MainActivity.kt
          grep -F 'android:allowBackup="false"' EastWeather/app/src/main/AndroidManifest.xml
          echo 'OTP-gated HiRider v0.7 source confirmed.'

      - name: Add Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON"
          printf '%s' "$GOOGLE_SERVICES_JSON" > EastWeather/app/google-services.json

      - name: Restore permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.HIRIDER_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Permanent signing key is not configured'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hirider-release.jks"
          chmod 600 "$RUNNER_TEMP/hirider-release.jks"

      - name: Build permanently signed APK
        working-directory: EastWeather
        env:
          HIRIDER_KEYSTORE_FILE: ${{ runner.temp }}/hirider-release.jks
          HIRIDER_KEYSTORE_PASSWORD: ${{ secrets.HIRIDER_KEYSTORE_PASSWORD }}
          HIRIDER_KEY_ALIAS: ${{ secrets.HIRIDER_KEY_ALIAS }}
          HIRIDER_KEY_PASSWORD: ${{ secrets.HIRIDER_KEY_PASSWORD }}
        run: gradle assembleRelease -Pkotlin.jvm.target.validation.mode=warning

      - uses: actions/upload-artifact@v4
        with:
          name: HiRider-v0.7-signed-OTP-APK
          path: EastWeather/app/build/outputs/apk/release/app-release.apk
